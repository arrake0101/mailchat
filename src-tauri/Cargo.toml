[package]
name = "mailchat"
version = "0.1.0"
edition = "2021"

[lib]
name = "mailchat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
mail-parser = "0.9"
genai = { version = "0.7.4", default-features = false, features = ["native-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["time", "macros"] }
futures = "0.3"
toml = "0.8"
